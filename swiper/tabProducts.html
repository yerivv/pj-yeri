<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Tab + Product Swiper Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      color: #222;
      margin: 0;
      padding: 40px 0 80px;
    }

    /* ── 탭 ── */
    .tab-swiper-block {
      position: relative;
      width: 500px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .tab-swiper-wrap { overflow: hidden; }

    .tab-swiper .swiper-wrapper { align-items: center; }
    .tab-swiper .swiper-slide   { width: auto !important; }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      padding: 8px 20px;
      border: 1px solid #ddd;
      border-radius: 100px;
      background: #fff;
      color: #666;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .tab-btn:hover { background: #f5f5f5; }

    .tab-btn.is-active {
      background: #1a56db;
      color: #fff;
      border-color: #1a56db;
      font-weight: 500;
    }

    .tab-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #555;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      transition: opacity 0.2s;
      line-height: 1;
      padding: 0;
    }

    .tab-arrow.swiper-button-disabled { opacity: 0; pointer-events: none; }
    .tab-arrow-prev { left: 0; }
    .tab-arrow-next { right: 0; }

    /* ── 상품 ── */
    .product-section {
      width: 1200px;
      margin: 20px auto 0;
      padding: 0 24px;
    }

    .product-panel   { display: none; }
    .product-panel.is-active { display: block; }

    .prod-swiper-block { position: relative; padding: 0 20px; }

    .prod-swiper-wrap { overflow: hidden; }

    .prod-swiper .swiper-slide {
      height: calc((100% - 16px) / 2) !important;
    }

    .prod-card {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }

    .prod-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }

    .prod-thumb {
      aspect-ratio: 4 / 3;
      background: #f8f8f8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      flex-shrink: 0;
    }

    .prod-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .prod-info {
      padding: 12px 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .prod-badge  { font-size: 11px; font-weight: 600; color: #e74c3c; margin: 0; }
    .prod-name   { font-size: 14px; font-weight: 500; color: #222; line-height: 1.4; margin: 0; }
    .prod-price  { font-size: 15px; font-weight: 700; color: #1a56db; margin: 4px 0 0; }

    .prod-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      transition: opacity 0.2s;
      padding: 0;
      line-height: 1;
    }

    .prod-arrow.swiper-button-disabled { opacity: 0.2; pointer-events: none; }
    .prod-arrow-prev { left: -20px; }
    .prod-arrow-next { right: -20px; }

    .prod-pagination {
      text-align: center;
      margin-top: 16px;
    }

    .prod-pagination .swiper-pagination-bullet {
      width: 8px; height: 8px;
      background: #ccc;
      opacity: 1;
    }

    .prod-pagination .swiper-pagination-bullet-active {
      background: #1a56db;
    }
  </style>
</head>
<body>

        <div class="swiper-wrapper">
          <!-- 탭 버튼은 JS가 데이터 보고 생성 -->

      </div>
    </div>
    <button class="tab-arrow tab-arrow-next" id="tabNext">&#8250;</button>

          { prdId: 'd03', prdName: '에르고 마우스',  price: '89,000원',  badgeTxt: 'NEW',  imgUrl: '' },
          { prdId: 'd04', prdName: '폰 케이스',      price: '29,000원',  badgeTxt: '',     imgUrl: '' },
          { prdId: 'd05', prdName: '스마트 조명',    price: '79,000원',  badgeTxt: 'SALE', imgUrl: '' },

    // 이미지 없을 때 탭별 fallback 이모지
    const TAB_EMOJI = {
      shoes: '👟', bag: '👜', clothes: '👗', acc: '⌚',
      sports: '🏃', beauty: '🧴', home: '🕯️', digital: '🎧',
    };

    // ============================================================
    // 설정
    // ============================================================
    const COLS     = 3;
    const ROWS     = 2;
    const PER_PAGE = COLS * ROWS; // 6

    // ============================================================
    // Swiper 인스턴스 저장
    // ============================================================
    const prodSwiperInst = {};

    // ============================================================
    // HTML 생성 헬퍼
    // ============================================================
    function createTabButtons() {
      const wrapper = document.querySelector('#tabSwiper .swiper-wrapper');
      wrapper.innerHTML = TAB_DATA.map((tab, i) => `
        <div class="swiper-slide">
          <button class="tab-btn ${i === 0 ? 'is-active' : ''}"
                  data-tab-id="${tab.tabId}" type="button">
            ${tab.tabName}
          </button>
        </div>
      `).join('');
    }

    function createProductPanels() {
      const section = document.getElementById('productSection');
      section.innerHTML = TAB_DATA.map((tab, i) => `
        <div class="product-panel ${i === 0 ? 'is-active' : ''}" data-panel-id="${tab.tabId}">
          <div class="prod-swiper-block">
            <button class="prod-arrow prod-arrow-prev" id="prodPrev_${tab.tabId}">&#8249;</button>
            <div class="prod-swiper-wrap">
              <div class="swiper prod-swiper" id="prodSwiper_${tab.tabId}" style="height:${ROWS === 2 ? '380px' : '200px'};">
                <div class="swiper-wrapper">
                  ${tab.products.map(prd => `
                    <div class="swiper-slide">
                      <div class="prod-card" data-prd-id="${prd.prdId}">
                        <div class="prod-thumb">
                          ${prd.imgUrl
                            ? `<img src="${prd.imgUrl}" alt="${prd.prdName}" loading="lazy">`
                            : (TAB_EMOJI[tab.tabId] || '🛍️')
                          }
                        </div>
                        <div class="prod-info">
                          ${prd.badgeTxt ? `<p class="prod-badge">${prd.badgeTxt}</p>` : ''}
                          <p class="prod-name">${prd.prdName}</p>
                          <p class="prod-price">${prd.price}</p>
                        </div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
            <button class="prod-arrow prod-arrow-next" id="prodNext_${tab.tabId}">&#8250;</button>
          </div>
          <div class="prod-pagination" id="prodPagination_${tab.tabId}"></div>
        </div>
      `).join('');
    }

    // ============================================================
    // Swiper 초기화
    // ============================================================
    function initProdSwiper(tabId) {
      if (prodSwiperInst[tabId]) return; // 중복 방지

      prodSwiperInst[tabId] = new Swiper(`#prodSwiper_${tabId}`, {
        slidesPerView  : COLS,
        slidesPerGroup : COLS,
        spaceBetween   : 16,
        grid: {
          rows : ROWS,
          fill : 'row',
        },
        navigation: {
          prevEl : `#prodPrev_${tabId}`,
          nextEl : `#prodNext_${tabId}`,
        },
        pagination: {
          el        : `#prodPagination_${tabId}`,
          clickable : true,
        },
      });
    }

    // ============================================================
    // 탭 전환
    // ============================================================
    function activateTab(tabId) {
      // 탭 버튼 active 클래스
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('is-active', btn.dataset.tabId === tabId);
      });

      // 상품 패널 전환
      document.querySelectorAll('.product-panel').forEach(panel => {
        panel.classList.toggle('is-active', panel.dataset.panelId === tabId);
      });

      // ✅ 클릭한 탭의 인덱스를 찾아 중앙으로 이동
      const idx = TAB_DATA.findIndex(t => t.tabId === tabId);
      if (idx !== -1) {
        tabSwiper.slideTo(idx);  // centeredSlides: true 이므로 자동으로 중앙 정렬
      }

      // 상품 Swiper 최초 초기화
      if (!prodSwiperInst[tabId]) {
        initProdSwiper(tabId);
      }
    }

    // ============================================================
    // 이벤트
    // ============================================================
    function bindEvents() {
      // 탭 클릭
      document.querySelector('#tabSwiper .swiper-wrapper')
        .addEventListener('click', e => {
          const btn = e.target.closest('.tab-btn');
          if (btn) activateTab(btn.dataset.tabId);
        });

      // 상품 카드 클릭
      document.getElementById('productSection')
        .addEventListener('click', e => {
          const card = e.target.closest('.prod-card');
          if (!card) return;
          console.log('상품 클릭:', card.dataset.prdId);
          // location.href = `/product/detail?prdId=${card.dataset.prdId}`;
        });
    }

    // ============================================================
    // 실행
    // ============================================================
    createTabButtons();
    createProductPanels();

    // 탭 Swiper
    const tabSwiper = new Swiper('#tabSwiper', {
      slidesPerView  : 'auto',
      spaceBetween   : 8,
      grabCursor     : true,
      centeredSlides : true,       // 활성 슬라이드를 중앙 기준으로 배치
      centeredSlidesBounds: true,  // 양 끝 탭은 끝까지만 이동 (중앙 고집 안 함)
      freeMode       : {
        enabled      : true,
        momentum     : true,
      },
      mousewheel     : {
        forceToAxis  : true,
      },
      navigation: {
        prevEl : '#tabPrev',
        nextEl : '#tabNext',
      },
    });

    bindEvents();
    activateTab(TAB_DATA[0].tabId); // 첫 번째 탭 초기화
  </script>

</body>
</html>
